<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppDeck 应用启动器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- 顶部工具栏 -->
    <header class="header">
      <h1>AppDeck 应用启动器</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn-icon" title="刷新">🔄</button>
        <button id="updateBtn" class="btn-icon" title="检查更新">⬇️</button>
        <span id="statusText" class="status-text"></span>
      </div>
    </header>

    <!-- 侧边栏：分类列表 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>分类</h2>
      </div>
      <nav class="categories">
        <button class="category-item active" data-category-id="">
          <span>全部应用</span>
          <span class="badge" id="totalCount">0</span>
        </button>
        <div id="categoryList"></div>
      </nav>

      <!-- 排序选项 -->
      <div class="sort-options">
        <h3>排序方式</h3>
        <label>
          <input type="radio" name="sort" value="default" checked>
          默认排序
        </label>
        <label>
          <input type="radio" name="sort" value="popular">
          热门排序
        </label>
      </div>
    </aside>

    <!-- 主内容区：应用网格 -->
    <main class="main-content">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索应用..." />
      </div>
      
      <div id="loadingMessage" class="loading" style="display: none;">
        加载中...
      </div>

      <div id="emptyMessage" class="empty-message" style="display: none;">
        <p>暂无应用数据</p>
        <button id="downloadDataBtn" class="btn-primary">下载数据</button>
      </div>

      <div id="appGrid" class="app-grid"></div>
    </main>
  </div>

  <!-- 应用详情模态框 -->
  <div id="appModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="appDetail"></div>
    </div>
  </div>

  <!-- 更新提示模态框 -->
  <div id="updateModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>发现新版本</h2>
      <div id="updateInfo"></div>
      <div class="modal-actions">
        <button id="downloadUpdateBtn" class="btn-primary">立即更新</button>
        <button id="cancelUpdateBtn" class="btn-secondary">稍后更新</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
